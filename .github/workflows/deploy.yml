name: Deploy Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 08:13 UTC = 16:13 Beijing time (UTC+8) on weekdays; shifted off the half-hour peak.
    - cron: "13 8 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements.lock
          python -m pip check

      - name: Validate code before fetching data
        run: |
          python -m unittest discover -s tests -v
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Check imports, credentials and trading calendar
        run: python scripts/update_health.py preflight
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: Generate watchlist dashboard
        run: python scripts/generate_dashboard.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: Generate watchlist charts
        run: python scripts/generate_growth_history.py --source watchlist
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: Generate listing status
        run: python scripts/generate_listing_status.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: Generate growth market dashboard
        run: python scripts/generate_growth_market_dashboard.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: Generate growth market charts
        run: python scripts/generate_growth_history.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: Generate small-cap rankings and charts
        run: python scripts/generate_small_cap_dashboard.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: Generate risk dashboard
        run: python scripts/generate_risk_dashboard.py --scope all
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: Generate shareholder watch
        run: python scripts/generate_shareholder_watch.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: Generate stock sectors
        run: python scripts/generate_stock_sectors.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: Validate generated data and create release manifest
        run: python scripts/update_health.py seal

      - name: Build frontend
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published release and data
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5; do
            if python3 scripts/update_health.py verify --base-url "$PAGE_URL"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 20; fi
          done
          exit 1
