name: Deploy Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reuse_data_run_id:
        description: "Optional: reuse saved generated data from a run (freshness is rechecked)"
        required: false
        type: string
  schedule:
    # 08:13 UTC = 16:13 Beijing time (UTC+8) on weekdays; shifted off the half-hour peak.
    - cron: "13 8 * * 1-5"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements.lock
          python -m pip check

      - name: Validate code before fetching data
        run: |
          python -m unittest discover -s tests -v
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Set data cache day
        id: cache-day
        if: ${{ !inputs.reuse_data_run_id }}
        run: echo "day=$(TZ=Asia/Shanghai date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore same-day source responses
        if: ${{ !inputs.reuse_data_run_id }}
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache-small-cap.local
            .cache-risk.local
            .cache-listing.local
            .cache-sectors.local
            .cache-active.local
          key: pipeline-${{ runner.os }}-${{ hashFiles('requirements.lock') }}-${{ steps.cache-day.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pipeline-${{ runner.os }}-${{ hashFiles('requirements.lock') }}-${{ steps.cache-day.outputs.day }}-

      - name: Check imports, credentials and trading calendar
        id: preflight
        if: ${{ !inputs.reuse_data_run_id }}
        run: python scripts/update_health.py preflight
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: Generate watchlist dashboard
        if: ${{ !inputs.reuse_data_run_id }}
        run: python scripts/generate_dashboard.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: Generate watchlist charts
        if: ${{ !inputs.reuse_data_run_id }}
        run: python scripts/generate_growth_history.py --source watchlist
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: Generate listing status
        if: ${{ !inputs.reuse_data_run_id }}
        run: python scripts/generate_listing_status.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: Generate growth market dashboard
        if: ${{ !inputs.reuse_data_run_id }}
        run: python scripts/generate_growth_market_dashboard.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: Generate growth market charts
        if: ${{ !inputs.reuse_data_run_id }}
        run: python scripts/generate_growth_history.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: Generate small-cap rankings and charts
        if: ${{ !inputs.reuse_data_run_id }}
        run: python scripts/generate_small_cap_dashboard.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: Generate risk dashboard
        if: ${{ !inputs.reuse_data_run_id }}
        run: python scripts/generate_risk_dashboard.py --scope all
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: Generate shareholder watch
        if: ${{ !inputs.reuse_data_run_id }}
        run: python scripts/generate_shareholder_watch.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: Generate stock sectors
        if: ${{ !inputs.reuse_data_run_id }}
        run: python scripts/generate_stock_sectors.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: Retain generated data for diagnosis and safe retries
        if: ${{ always() && steps.preflight.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data
          path: public/data
          retention-days: 3
          overwrite: true

      - name: Save same-day source responses
        if: ${{ always() && steps.preflight.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .cache-small-cap.local
            .cache-risk.local
            .cache-listing.local
            .cache-sectors.local
            .cache-active.local
          key: pipeline-${{ runner.os }}-${{ hashFiles('requirements.lock') }}-${{ steps.cache-day.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore explicitly selected data artifact
        if: ${{ inputs.reuse_data_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: dashboard-data
          path: public/data
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_data_run_id }}

      - name: Recheck saved data against fresh trading calendar
        if: ${{ inputs.reuse_data_run_id != '' }}
        run: python scripts/update_health.py recheck
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: Validate generated data and create release manifest
        id: release
        run: |
          python scripts/update_health.py seal
          echo "release_id=${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published release and data
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_RELEASE: ${{ needs.build.outputs.release_id }}
        run: |
          for attempt in 1 2 3 4 5; do
            if python3 scripts/update_health.py verify --base-url "$PAGE_URL" --run-id "$EXPECTED_RELEASE"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 20; fi
          done
          exit 1
